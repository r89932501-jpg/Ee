name: Deploy profile to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Extract website from ZIP
        run: |
          python - <<'PY'
          import glob, zipfile, os, shutil
          archives = glob.glob("*.zip") + glob.glob("*.ZIP")
          if not archives:
              raise SystemExit("No ZIP archive found")
          archive = max(archives, key=os.path.getsize)
          os.makedirs("site", exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              z.extractall("extracted")
          matches = glob.glob("extracted/**/index.html", recursive=True)
          if not matches:
              raise SystemExit("index.html not found in ZIP")
          root = os.path.dirname(matches[0])
          for name in os.listdir(root):
              src = os.path.join(root, name)
              dst = os.path.join("site", name)
              if os.path.isdir(src):
                  shutil.copytree(src, dst, dirs_exist_ok=True)
              else:
                  shutil.copy2(src, dst)
          index_path = os.path.join("site", "index.html")
          with open(index_path, "r", encoding="utf-8") as f:
              html = f.read()
          broken = "const D = const D ="
          if broken in html:
              html = html.replace(broken, "const D =", 1)
              with open(index_path, "w", encoding="utf-8") as f:
                  f.write(html)
              print("Fixed duplicate const D declaration in index.html")
          else:
              print("No duplicate const D declaration found")
          print("Published website root:", root)
          PY
      - name: Apply shared visual theme to every page
        run: |
          python - <<'PY'
          import os
          shutil_path = "unified.css"
          if not os.path.isfile(shutil_path):
              raise SystemExit("unified.css is missing")
          import shutil
          shutil.copy2(shutil_path, "site/unified.css")
          for base, dirs, files in os.walk("site"):
              for name in files:
                  if not name.lower().endswith(".html"):
                      continue
                  path = os.path.join(base, name)
                  with open(path, "r", encoding="utf-8") as f:
                      html = f.read()
                  if "unified.css" in html:
                      continue
                  rel = os.path.relpath("site/unified.css", base).replace(os.sep, "/")
                  tag = '<link rel="stylesheet" href="' + rel + '">'
                  if "</head>" in html.lower():
                      pos = html.lower().find("</head>")
                      html = html[:pos] + tag + "\\n" + html[pos:]
                  else:
                      html = tag + "\\n" + html
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(html)
          print("Unified theme attached to all HTML pages")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
